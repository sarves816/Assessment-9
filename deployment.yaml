apiVersion: apps/v1
kind: Deployment
metadata:
  name: university-portal
spec:
  replicas: 2
  selector:
    matchLabels:
      app: university-portal
  template:
    metadata:
      labels:
        app: university-portal
    spec:
      containers:
        - name: university-portal
          image: sarves816/university-portal:v1
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: university-portal-service
spec:
  type: NodePort
  selector:
    app: university-portal
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30081
